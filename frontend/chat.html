<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | Realtime</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #f3f4f6;
            --sidebar-bg: #ffffff;
            --chat-bg: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --sent-msg-bg: #6366f1;
            --sent-msg-text: #ffffff;
            --received-msg-bg: #f3f4f6;
            --received-msg-text: #1f2937;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); height: 100vh; display: flex; overflow: hidden; }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        .logout-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.2s;
        }
        .logout-btn:hover { color: #ef4444; }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 12px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus { border-color: var(--primary-color); }

        .btn-icon {
            padding: 8px 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-icon:hover { background: var(--primary-hover); }

        .dm-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .dm-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
            transition: background 0.2s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
            font-size: 0.95rem;
        }
        .dm-item:hover { background: var(--bg-color); }
        .dm-item i { color: var(--text-secondary); }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            position: relative;
        }

        .no-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            gap: 16px;
        }
        .no-chat i { font-size: 3rem; color: var(--border-color); }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
        }

        .chat-title {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 1.1rem;
        }
        .chat-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .message {
            max-width: 70%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message.sent {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.received {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-sender {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-left: 4px;
            margin-right: 4px;
        }

        .msg-bubble {
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
            word-wrap: break-word;
        }

        .message.sent .msg-bubble {
            background: var(--sent-msg-bg);
            color: var(--sent-msg-text);
            border-bottom-right-radius: 2px;
        }

        .message.received .msg-bubble {
            background: var(--received-msg-bg);
            color: var(--received-msg-text);
            border-bottom-left-radius: 2px;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            background: white;
            align-items: center;
        }

        .input-area input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-area input[type="text"]:focus { border-color: var(--primary-color); }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #f3f4f6;
            color: #6b7280;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .icon-btn:hover { background: #e5e7eb; color: #374151; }

        .send-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .send-btn:hover { transform: scale(1.05); background: var(--primary-hover); }
        
        .msg-image {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 4px;
            cursor: pointer;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="user-profile">
                <div class="user-avatar" id="userAvatar">U</div>
                <span id="displayUsername">User</span>
            </div>
            <button class="logout-btn" onclick="logout()" title="Logout">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>

        <div class="sidebar-content">
            <!-- Create Session -->
            <div>
                <div class="section-title">Create Room</div>
                <div class="input-group">
                    <input type="text" id="newSessionName" placeholder="Room Name">
                    <button class="btn-icon" onclick="createSession()">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>

            <!-- Join Session -->
            <div>
                <div class="section-title">Join Room</div>
                <div class="input-group">
                    <input type="text" id="joinSessionName" placeholder="Room Name">
                    <button class="btn-icon" onclick="joinSessionByName()">
                        <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    </button>
                </div>
            </div>

            <!-- Direct Message -->
            <div>
                <div class="section-title">Direct Message</div>
                <div class="input-group">
                    <input type="text" id="dmUsername" placeholder="Username">
                    <button class="btn-icon" onclick="startDirectChat()">
                        <i class="fa-regular fa-paper-plane"></i>
                    </button>
                </div>
            </div>

            <!-- DM List -->
            <div style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
                <div class="section-title" style="margin-top: 10px;">Recent Chats</div>
                <div id="dmList" class="dm-list" style="overflow-y: auto; flex: 1;">
                    <!-- DMs will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area">
        <div id="noChat" class="no-chat">
            <i class="fa-regular fa-comments"></i>
            <p>Select a chat or create a new room to start messaging</p>
        </div>

        <div id="chatInterface" style="display: none; flex-direction: column; height: 100%;">
            <div class="chat-header">
                <div class="user-avatar" style="width: 36px; height: 36px; font-size: 1rem; background: #e5e7eb; color: #374151;">
                    <i class="fa-solid fa-hashtag"></i>
                </div>
                <div>
                    <div class="chat-title" id="currentChatName">Room Name</div>
                    <div class="chat-subtitle">ID: <span id="currentChatId"></span></div>
                </div>
                <button class="icon-btn" style="margin-left:auto;" onclick="startCall()" title="Video Call">
                    <i class="fa-solid fa-video"></i>
                </button>
            </div>

            <div class="messages-container" id="messagesList">
                <!-- Messages go here -->
            </div>

            <div class="input-area">
                <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="uploadImage(this)">
                <button class="icon-btn" onclick="document.getElementById('imageInput').click()" title="Send Image">
                    <i class="fa-regular fa-image"></i>
                </button>
                <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Video Call Overlay -->
    <div id="callModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:1000; flex-direction:column; align-items:center; justify-content:center; gap:20px;">
        <div style="display:flex; gap:16px; flex-wrap:wrap; justify-content:center;">
            <video id="localVideo" autoplay playsinline muted style="width:280px; border-radius:8px; background:#000; transform:scaleX(-1);"></video>
            <video id="remoteVideo" autoplay playsinline style="width:280px; border-radius:8px; background:#000;"></video>
        </div>
        <button class="send-btn" style="background:#ef4444;" onclick="endCall()" title="End Call">
            <i class="fa-solid fa-phone-slash"></i>
        </button>
    </div>

    <script>
        const token = localStorage.getItem('chat_token');
        let username = localStorage.getItem('chat_username');
        let socket = null;
        let currentChatId = null;

        if (!token) {
            window.location.href = 'login.html';
        }

        if (!username && token) {
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                username = payload.sub;
                localStorage.setItem('chat_username', username);
            } catch (e) {
                console.error("Failed to decode token", e);
            }
        }

        document.getElementById('displayUsername').textContent = username || 'User';
        document.getElementById('userAvatar').textContent = (username || 'U').charAt(0).toUpperCase();
        
        loadDMs();

        function logout() {
            localStorage.removeItem('chat_token');
            localStorage.removeItem('chat_username');
            window.location.href = 'login.html';
        }

        async function loadDMs() {
            try {
                const res = await fetch('/chats/dms', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const dms = await res.json();
                    const list = document.getElementById('dmList');
                    list.innerHTML = '';
                    
                    if (dms.length === 0) {
                        list.innerHTML = '<div style="color:#9ca3af; font-size:0.85rem; padding: 0 5px;">No conversations yet</div>';
                        return;
                    }

                    dms.forEach(dm => {
                        const btn = document.createElement('button');
                        btn.className = 'dm-item';
                        btn.innerHTML = `
                            <div class="user-avatar" style="width: 32px; height: 32px; font-size: 0.9rem; background: #e5e7eb; color: #374151;">
                                ${dm.other_user.charAt(0).toUpperCase()}
                            </div>
                            <span>${dm.other_user}</span>
                        `;
                        btn.onclick = () => joinSession(dm.chat_id, dm.other_user);
                        list.appendChild(btn);
                    });
                }
            } catch (e) {
                console.error("Failed to load DMs", e);
            }
        }

        async function createSession() {
            const name = document.getElementById('newSessionName').value;
            if (!name) return alert("Please enter a session name");

            try {
                const res = await fetch('/chats/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ name: name })
                });

                if (res.ok) {
                    const data = await res.json();
                    if (data.created) {
                        alert(`Session "${data.name}" Created Successfully!`);
                    } else {
                        alert(`Session "${data.name}" already exists. Joining it...`);
                    }
                    joinSession(data.chat_id, data.name);
                } else {
                    alert("Failed to create session");
                }
            } catch (e) {
                alert("Error: " + e.message);
            }
        }

        async function joinSessionByName() {
            const name = document.getElementById('joinSessionName').value;
            if (!name) return alert("Please enter a Session Name");

            try {
                const res = await fetch(`/chats/find/${name}`);
                const data = await res.json();

                if (data.error) {
                    alert("Session not found!");
                } else {
                    joinSession(data.chat_id, data.name);
                }
            } catch (e) {
                alert("Error finding session: " + e.message);
            }
        }

        async function startDirectChat() {
            const target = document.getElementById('dmUsername').value;
            if (!target) return alert("Please enter a username");

            try {
                const res = await fetch('/chats/direct', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ target_username: target })
                });

                if (res.ok) {
                    const data = await res.json();
                    joinSession(data.chat_id, data.name);
                    loadDMs(); // Refresh list
                } else {
                    const err = await res.json();
                    alert("Error: " + (err.detail || "Failed to start chat"));
                }
            } catch (e) {
                alert("Error: " + e.message);
            }
        }

        function joinSession(id, name) {
            if (!id) return;

            if (socket) {
                socket.close();
            }

            currentChatId = id;
            document.getElementById('noChat').style.display = 'none';
            document.getElementById('chatInterface').style.display = 'flex';
            document.getElementById('currentChatId').textContent = id;
            document.getElementById('currentChatName').textContent = name || 'Unknown';
            document.getElementById('messagesList').innerHTML = '';

            loadHistory(id);
            connectWebSocket(id);
        }

        async function loadHistory(chatId) {
            try {
                const res = await fetch(`/chats/${chatId}/messages`);
                if (res.ok) {
                    const messages = await res.json();
                    messages.forEach(msg => {
                        const type = msg.sender === username ? 'sent' : 'received';
                        appendMessage(msg.text, type, msg.sender, msg.msg_type || 'text');
                    });
                }
            } catch (e) {
                console.error("Failed to load history", e);
            }
        }

        function connectWebSocket(chatId) {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            socket = new WebSocket(`${protocol}//${host}/ws/chat/${chatId}?token=${token}`);

            socket.onopen = () => {
                console.log("Connected to chat " + chatId);
            };

            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);

                    if (SIGNALING_TYPES.includes(data.type)) {
                        handleSignal(data);
                        return;
                    }

                    const type = data.sender === username ? 'sent' : 'received';
                    appendMessage(data.text, type, data.sender, data.type || 'text');
                } catch (e) {
                    console.error("Error parsing message:", e);
                }
            };

            socket.onclose = () => {
                console.log("Disconnected");
            };
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value;
            if (text && socket && socket.readyState === WebSocket.OPEN) {
                const payload = JSON.stringify({ text: text, type: 'text' });
                socket.send(payload);
                input.value = '';
            }
        }

        async function uploadImage(input) {
            const file = input.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/upload/image', {
                    method: 'POST',
                    body: formData
                });

                if (res.ok) {
                    const data = await res.json();
                    if (socket && socket.readyState === WebSocket.OPEN) {
                        const payload = JSON.stringify({ text: data.url, type: 'image' });
                        socket.send(payload);
                    }
                } else {
                    alert("Failed to upload image");
                }
            } catch (e) {
                console.error("Error uploading image:", e);
                alert("Error uploading image");
            }
            input.value = ''; // Reset input
        }

        function appendMessage(text, type, senderName, msgType = 'text') {
            const list = document.getElementById('messagesList');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            
            let senderHtml = '';
            if (type === 'received') {
                senderHtml = `<div class="msg-sender">${senderName || 'Unknown'}</div>`;
            }
            
            let contentHtml = '';
            if (msgType === 'image') {
                // Ensure URL is absolute if it's relative
                const url = text.startsWith('http') ? text : text;
                contentHtml = `<img src="${url}" class="msg-image" onclick="window.open(this.src, '_blank')">`;
            } else {
                contentHtml = text;
            }
            
            div.innerHTML = `${senderHtml}<div class="msg-bubble">${contentHtml}</div>`;
            list.appendChild(div);
            list.scrollTop = list.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // ---------- WebRTC 1:1 video calling ----------
        const SIGNALING_TYPES = ['call-offer', 'call-answer', 'ice-candidate', 'call-end'];
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        let peerConnection = null;
        let localStream = null;

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);

            peerConnection.onicecandidate = (event) => {
                if (event.candidate && socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: 'ice-candidate', candidate: event.candidate }));
                }
            };

            peerConnection.ontrack = (event) => {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
            };

            peerConnection.onconnectionstatechange = () => {
                if (['disconnected', 'failed', 'closed'].includes(peerConnection.connectionState)) {
                    endCall(false);
                }
            };
        }

        async function startCall() {
            if (!socket || socket.readyState !== WebSocket.OPEN) return alert("Join a chat first");

            document.getElementById('callModal').style.display = 'flex';
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;

            createPeerConnection();
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.send(JSON.stringify({ type: 'call-offer', sdp: offer }));
        }

        async function handleSignal(data) {
            if (data.type === 'call-offer') {
                document.getElementById('callModal').style.display = 'flex';
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;

                createPeerConnection();
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                socket.send(JSON.stringify({ type: 'call-answer', sdp: answer }));
            } else if (data.type === 'call-answer') {
                if (peerConnection) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                }
            } else if (data.type === 'ice-candidate') {
                if (peerConnection && data.candidate) {
                    try {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                    } catch (e) {
                        console.error("Error adding ICE candidate", e);
                    }
                }
            } else if (data.type === 'call-end') {
                endCall(false);
            }
        }

        function endCall(notify = true) {
            if (notify && socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'call-end' }));
            }
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            document.getElementById('callModal').style.display = 'none';
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
        }
    </script>
</body>
</html>
